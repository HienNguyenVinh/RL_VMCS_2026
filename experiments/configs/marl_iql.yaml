# Configuration for Multi-Agent RL (Independent Q-Learning) Experiments
experiment_name: "marl_iql_sweep"
episodes: 500
max_steps_per_episode: 50

marl:
  learning_rates: [0.05, 0.1, 0.2]
  gammas: [0.85, 0.90, 0.95]
  epsilons: [0.1, 0.2, 0.5, 1.0]
  epsilon_decay: 0.995
  epsilon_min: 0.05

coordination:
  conflict_penalties: [0.0, -5.0, -10.0, -20.0]
  shared_weights: [0.0, 0.5, 0.7, 1.0]
